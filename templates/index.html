<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ myapp }}</title>
</head>
<body>
    <p>Автор проекта: {{ author_name }}</p>
    <p>Группа: {{ group }}</p>

    <ul>
    {% for item in navigation %}
        <li><a href="{{ item.href }}">{{ item.caption }}</a></li>
    {% endfor %}
    </ul>

    <h1>{{ myapp }}</h1>

    {{ a_variable | default('') }}
</body>
</html>
